<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloMetric - iOS Bike Component Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center text-center p-6">
    
    <div class="glass max-w-2xl p-12 rounded-3xl shadow-2xl">
        <h1 class="text-5xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-blue-500">

        <p class="text-xl text-gray-400 mb-8">

        </p>
        
        <div class="flex justify-center space-x-4">
            <a href="https://github.com/yourusername/VeloMetric" class="px-8 py-3 bg-white text-black font-semibold rounded-full hover:bg-gray-200 transition">
                View on GitHub
            </a>
            <a href="#" class="px-8 py-3 glass text-green-400 font-semibold rounded-full hover:bg-white/10 transition">
                Download TestFlight

        </div>
    </div>

</html>
