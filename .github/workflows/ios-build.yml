name: Build iOS App (VeloMetric)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GoogleService-Info.plist
        run: |
          cat << 'EOF' > src/VeloMetric/GoogleService-Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>API_KEY</key>
          	<string>AIzaSyCqTCqWpmB6NaqfOLlKRLGKHb7Ct8hHlzg</string>
          	<key>GCM_SENDER_ID</key>
          	<string>207443869937</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>com.francescocastaldi.VeloMetric</string>
          	<key>PROJECT_ID</key>
          	<string>velometric-app-72c0e</string>
          	<key>STORAGE_BUCKET</key>
          	<string>velometric-app-72c0e.firebasestorage.app</string>
          	<key>IS_ADS_ENABLED</key>
          	<false/>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true/>
          	<key>IS_GCM_ENABLED</key>
          	<true/>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true/>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:207443869937:ios:739fc2be6f4ba9d5cd6950</string>
          </dict>
          </plist>
          EOF

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls /Applications/ | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -project VeloMetric.xcodeproj \
                     -scheme VeloMetric \
                     -clonedSourcePackagesDirPath SourcePackages \
                     -resolvePackageDependencies

      - name: Build iOS Application
        run: |
          xcodebuild -project VeloMetric.xcodeproj \
                     -scheme VeloMetric \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath DerivedData \
                     -clonedSourcePackagesDirPath SourcePackages \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     build 2>&1 | tail -100

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/VeloMetric.app Payload/
          zip -r VeloMetric.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: VeloMetric-iOS-App
          path: VeloMetric.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          name: "VeloMetric Build #${{ github.run_number }}"
          body: |
            ## 🚴 VeloMetric iOS App — Build #${{ github.run_number }}

            Auto-built from commit `${{ github.sha }}`.

            ### How to install
            1. Download `VeloMetric.ipa` below
            2. Use [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io) to sideload on your iPhone
            3. Or open `VeloMetric.xcodeproj` in Xcode and run directly via USB

            > ⚠️ This is an unsigned build. You need a sideloading tool or Xcode to install it.
          files: VeloMetric.ipa
          draft: false
          prerelease: false
