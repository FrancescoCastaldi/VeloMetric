name: Build iOS App (VeloMetric)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build iOS Application (.app & .ipa)
        run: |
          xcodebuild -project VeloMetric.xcodeproj \
                     -scheme VeloMetric \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

          mkdir -p Payload
          cp -r build/Release-iphoneos/VeloMetric.app Payload/
          zip -r VeloMetric.ipa Payload

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloMetric-iOS-App
          path: VeloMetric.ipa
